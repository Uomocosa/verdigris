# CRITICAL (agents): never change this file unless the user asked for that change in this
# conversation. A lint error is fixed in the code, not here. The [lele.rules.*] tables are
# kept in sync by `lele-lint --sync-config` (and `lele-bevy-lint --sync-config`): it adds
# new rules and refreshes the `# CODE · summary` lines; it never changes a level, reason
# or exemption.

[lele.project]

[[lele.project.boundary]]
name       = "rule-engine is headless"
why        = "Rules read world state and write messages/choices/components; time, randomness and input arrive as resources, never as hidden I/O."
folders    = ["crates/rule-engine/src"]
cannot_use = ["bevy::render", "bevy::ui", "bevy::window", "std::time", "rand", "std::fs"]
require    = "honest"

[[lele.project.flat_dir]]
path   = "crates/rule-engine/__rules__"
reason = "Holds only Comprehensive Rules Bevy systems, one file per rule; shared items live at the crate root."

[[lele.project.entry_points]]
file = "crates/event-derive/src/lib.rs"
fn = "derive_event_args"
reason = "proc-macro entry point"

[honesty]
declared_honest = []
declared_dishonest = ["std::time::SystemTime::now", "std::time::Instant::now", "rand::thread_rng", "rand::random", "getrandom::getrandom", "std::fs::read", "std::fs::write", "std::env::var"]

[verdigris.lint]
comprehensive_rules = "docs/MagicCompRules-20250919.txt"

